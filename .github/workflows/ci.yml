name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  # O Testador (agente 22) bloqueia deploy que afrouxe limite sem revisão.
  limites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Avisar quando limits.ts muda
        run: |
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q 'src/config/limits.ts'; then
            echo "::warning file=src/config/limits.ts::Os limites do Guardiao foram alterados neste PR. Revise com atencao: afrouxar limite e a forma mais silenciosa de aumentar risco."
          fi
